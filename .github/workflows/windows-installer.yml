name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "*.html"
      - "requirements.txt"
      - "installer.iss"
      - ".github/workflows/windows-installer.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"
      - name: Check Python syntax
        run: python -m py_compile server.py local_media.py desktop.py
      - name: Build standalone Windows application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "AI-Music-Video-Studio" --add-data "index.html;." --collect-all "faster_whisper" --collect-all "ctranslate2" desktop.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Create EXE installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Music-Video-Studio-Windows-Installer
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 30
